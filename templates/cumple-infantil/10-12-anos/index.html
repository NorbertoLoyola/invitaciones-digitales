<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark only">
<meta name="theme-color" content="#0A0A12">
<title>Cumple gamer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     MOTOR DE PLANTILLA — CONFIG
     Todo el contenido editable vive en el objeto CONFIG (abajo,
     dentro del <script>). Los estilos de acá no deberían tocarse
     para generar una invitación nueva: sólo se edita CONFIG.
     Tema: gamer/pixel-art/neón, pensado para 10-12 años — estética
     más "cool" y menos infantil que el resto de la categoría.
     Motivos vía emoji (🎮🕹️👾⚡) — sin depender de clip art con
     licencia ni de personajes/consolas de marca.
     ============================================================ */

  :root{
    --fondo: #0A0A12;
    --fondo-claro: #14141F;
    --verde: #39FF88;
    --violeta: #B14EFF;
    --rosa: #FF2E8A;
    --texto: #EAEAF5;
    --texto-suave: #8E8EA8;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; color-scheme:dark; background:var(--fondo); }
  body{
    font-family:'Chakra Petch', sans-serif;
    font-weight:500;
    color:var(--texto);
    color-scheme:dark;
    background:
      radial-gradient(circle at 12% 10%, rgba(57,255,136,0.10), transparent 35%),
      radial-gradient(circle at 90% 22%, rgba(177,78,255,0.12), transparent 40%),
      radial-gradient(circle at 20% 88%, rgba(255,46,138,0.08), transparent 40%),
      linear-gradient(180deg, var(--fondo) 0%, #0D0D18 55%, var(--fondo-claro) 140%);
    background-attachment:fixed;
    overflow-x:hidden;
    position:relative;
  }

  h1,h2{ font-family:'Press Start 2P', monospace; font-weight:400; margin:0; }

  .wrap{ max-width:480px; margin:0 auto; position:relative; z-index:1; }

  section{ padding:64px 30px; text-align:center; position:relative; z-index:1; }

  .fade-up{ opacity:0; transform:translateY(22px); transition:opacity .9s ease, transform .9s ease; }
  .fade-up.visible{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){ .fade-up{ opacity:1; transform:none; transition:none; } .floatie{ display:none; } }

  /* ---------- Elementos flotantes de fondo (joystick/control/invasor/rayo) ---------- */
  .floaties{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .floatie{
    position:absolute; bottom:-12%; opacity:0; line-height:1;
    animation-name: floatUp; animation-timing-function: ease-in; animation-iteration-count: infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:.8; }
    92%{ opacity:.55; }
    100%{ transform:translateY(-112vh) translateX(26px) rotate(-12deg); opacity:0; }
  }

  /* ---------- Hero ---------- */
  #hero{ min-height:92vh; display:flex; flex-direction:column; justify-content:center; padding-top:44px; }

  .typed-title{
    position:relative; display:inline-block;
    font-family:'Press Start 2P', monospace;
    font-size:.62rem; line-height:1.6; letter-spacing:.04em;
    color:var(--verde); margin-bottom:16px; min-height:2.6em;
  }
  .typed-title .ch{ display:inline-block; opacity:0; transform:translateY(6px); animation:chIn .35s ease forwards; }
  .typed-title .ch.space{ width:.5em; }
  @keyframes chIn{ to{ opacity:1; transform:translateY(0); } }
  .typed-title::after{
    content:""; display:inline-block; width:8px; height:.9em;
    background:var(--rosa); margin-left:3px; vertical-align:-1px;
    animation:caretBlink .8s steps(1) infinite;
  }
  .typed-title.done::after{ animation:none; opacity:0; }
  @keyframes caretBlink{ 50%{ opacity:0; } }

  .kid-name{ font-family:'Press Start 2P', monospace; font-size:1.9rem; line-height:1.4; color:#fff; margin:10px 0; text-shadow:0 0 14px rgba(177,78,255,0.6), 3px 3px 0 var(--rosa); }
  .edad-tag{ display:inline-block; background:var(--violeta); color:#fff; font-family:'Press Start 2P', monospace; font-weight:400; font-size:.62rem; padding:9px 16px; margin-bottom:16px; }
  .the-date{ font-size:1rem; font-weight:600; letter-spacing:.04em; color:var(--texto-suave); }
  .scroll-hint{ margin-top:52px; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--verde); opacity:.85; }

  .divider{ width:60px; height:2px; background:var(--violeta); margin:0 auto; opacity:.5; box-shadow:0 0 8px var(--violeta); }

  /* ---------- Countdown ---------- */
  .countdown{ display:flex; justify-content:center; gap:12px; margin-top:26px; }
  .cd-box{ min-width:54px; background:rgba(57,255,136,0.06); border:1px solid var(--verde); padding:10px 4px; }
  .cd-num{ font-family:'Press Start 2P', monospace; font-size:1.15rem; color:var(--verde); }
  .cd-label{ font-size:.56rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--texto-suave); margin-top:6px; }

  /* ---------- Itinerario / lugar ---------- */
  .itinerary-item{ display:flex; align-items:flex-start; gap:16px; text-align:left; max-width:300px; margin:0 auto 22px; }
  .itinerary-time{ font-family:'Press Start 2P', monospace; font-size:.72rem; color:var(--rosa); min-width:64px; }
  .itinerary-what{ font-size:.92rem; font-weight:500; color:var(--texto); }

  .venue-name{ font-size:1.1rem; font-weight:700; color:var(--verde); margin-top:6px; }
  .venue-addr{ font-size:.85rem; color:var(--texto-suave); margin-top:4px; }

  .btn{
    display:inline-block; margin-top:20px; padding:14px 28px;
    background:var(--violeta); color:#fff;
    text-decoration:none; font-family:'Press Start 2P', monospace; font-weight:400; font-size:.62rem; letter-spacing:.02em;
    border-radius:0; transition:background .2s ease, transform .15s ease;
    box-shadow:3px 3px 0 var(--rosa);
  }
  .btn:hover{ background:var(--verde); color:var(--fondo); transform:translate(1px,1px); box-shadow:2px 2px 0 var(--rosa); }
  .btn.outline{ background:transparent; border:2px solid var(--verde); color:var(--verde); box-shadow:3px 3px 0 var(--violeta); }

  .nota-tag{ display:inline-block; padding:14px 18px; background:rgba(177,78,255,0.08); border:1px solid var(--violeta); font-size:.88rem; font-weight:500; margin-top:10px; max-width:300px; line-height:1.5; color:var(--texto); }

  .gallery{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:24px; }
  .ph{ aspect-ratio:1; background:rgba(255,255,255,0.02); border:1px dashed var(--verde); display:flex; align-items:center; justify-content:center; font-size:.62rem; font-weight:600; color:var(--texto-suave); letter-spacing:.04em; text-align:center; padding:8px; font-family:'Chakra Petch', sans-serif; }

  .mensaje-texto{ font-size:1rem; font-weight:500; line-height:1.8; max-width:310px; margin:20px auto 0; color:var(--texto); }
  .mensaje-firma{ font-family:'Press Start 2P', monospace; font-size:.9rem; color:var(--rosa); margin-top:16px; }

  .rsvp-note{ font-size:.85rem; color:var(--texto-suave); max-width:280px; margin:14px auto 0; line-height:1.6; }
  .rsvp-input{ display:block; width:100%; max-width:240px; margin:14px auto 0; padding:11px 14px; border-radius:0; border:1px solid var(--verde); font-family:'Chakra Petch', sans-serif; font-size:.85rem; text-align:center; background:rgba(255,255,255,.05); color:var(--texto); }
  .rsvp-input::placeholder{ color:var(--texto-suave); }

  footer{ padding:56px 30px 76px; text-align:center; }
  footer .footer-name{ font-family:'Press Start 2P', monospace; font-size:1.1rem; color:var(--verde); }

  .config-flag{
    position:fixed; bottom:10px; right:10px; background:var(--verde); color:var(--fondo);
    font-size:.6rem; padding:4px 8px; opacity:.6; font-family:'Chakra Petch',sans-serif; z-index:5;
  }
</style>
</head>
<body>

<div class="floaties" id="floaties"></div>

<div class="wrap">
  <section id="hero" class="fade-up">
    <div class="typed-title" id="typedTitle"></div>
    <h1 class="kid-name" id="kid-name"></h1>
    <div class="edad-tag" id="edad-tag"></div>
    <div class="the-date" id="the-date"></div>
    <div class="scroll-hint">Deslizá para ver más ↓</div>
  </section>

  <div class="divider"></div>

  <section id="countdown-section" class="fade-up">
    <h2 style="font-size:.9rem;">Cargando...</h2>
    <div class="countdown">
      <div class="cd-box"><div class="cd-num" id="cd-d">00</div><div class="cd-label">días</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-h">00</div><div class="cd-label">hs</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-m">00</div><div class="cd-label">min</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-s">00</div><div class="cd-label">seg</div></div>
    </div>
  </section>

  <div class="divider"></div>

  <section id="itinerary-section" class="fade-up">
    <h2 style="font-size:.9rem;">La partida</h2>
    <div id="itinerary-list" style="margin-top:26px;"></div>
    <div class="venue-name" id="venue-name"></div>
    <div class="venue-addr" id="venue-addr"></div>
    <a class="btn outline" id="maps-btn" href="#" target="_blank" rel="noopener">Cómo llegar</a>
  </section>

  <div class="divider"></div>

  <section id="nota-section" class="fade-up">
    <h2 style="font-size:.9rem;">Un dato</h2>
    <div class="nota-tag" id="nota-text"></div>
  </section>

  <div class="divider"></div>

  <section id="gallery-section" class="fade-up">
    <h2 style="font-size:.9rem;">Capturas</h2>
    <div class="gallery" id="gallery-grid"></div>
  </section>

  <div class="divider"></div>

  <section id="mensaje-section" class="fade-up">
    <h2 style="font-size:.9rem;">Mensaje</h2>
    <p class="mensaje-texto" id="mensaje-texto"></p>
    <div class="mensaje-firma" id="mensaje-firma"></div>
  </section>

  <div class="divider"></div>

  <section id="rsvp-section" class="fade-up">
    <h2 style="font-size:.85rem;">Confirmá tu asistencia</h2>
    <p class="rsvp-note" id="rsvp-note"></p>
    <input type="text" class="rsvp-input" id="rsvp-nombre" placeholder="Tu nombre" autocomplete="name">
    <a class="btn" id="rsvp-btn" href="#" target="_blank" rel="noopener">Confirmar por WhatsApp</a>
  </section>

  <footer class="fade-up">
    <div class="footer-name" id="footer-name"></div>
    <p style="font-size:.85rem; color:var(--texto-suave); margin-top:14px;" id="footer-note"></p>
  </footer>
</div>

<div class="config-flag">TEMPLATE · cumple-infantil-10-12-anos-gamer v1</div>

<script>
/* ============================================================
   CONFIG — esto es lo único que se edita por cada cliente.
   ============================================================ */
const CONFIG = {
  nombre: "Mateo",
  tituloTipeo: "Nivel 12 desbloqueado",
  edadTexto: "Cumple 12 años",
  fechaTexto: "21 de Noviembre, 2026",
  fechaCountdown: "2026-11-21T17:00:00",
  itinerario: [
    { hora: "17:00", que: "Entrada de jugadores" },
    { hora: "17:30", que: "Torneo de videojuegos" },
    { hora: "19:00", que: "Torta y snacks" },
    { hora: "20:00", que: "Entrega de premios" },
  ],
  lugarNombre: "Arena Gamer",
  lugarDireccion: "Av. Rivadavia 3200, Buenos Aires",
  mapsUrl: "https://maps.google.com/?q=Arena+Gamer",
  nota: "Va a haber torneo de videojuegos con premios 🎮. Traé tu mejor combo de buena onda — no hace falta traer control propio.",
  fotos: 4,
  mensaje: "Mateo subió de nivel y quiere celebrarlo con la mejor party. ¡Preparate para jugar, reírte y pasarla increíble con nosotros!",
  mensajeFirma: "Con cariño, Mamá y Papá",
  rsvpNota: "Por favor confirmá la asistencia antes del 10 de Noviembre para organizar todo con cariño.",
  whatsappNumero: "5491100000000",
  whatsappMensaje: "¡Hola! Confirmo mi asistencia al cumple gamer de Mateo 🎮",
  footerNota: "Gracias por sumarte a la partida.",
};

// --- Registro de RSVP (Fase 2 del plan comercial: Google Sheet + Apps Script) ---
const RSVP_LOG_URL = "https://script.google.com/macros/s/AKfycbwGLit2nqmSdkGmVQ0AkfWIrZCIO-vGibaWQ9VYZ7XsrhbU7KoK4t3XSYVMpSE_fyPB/exec";
function registrarRSVP(datos){
  if(!RSVP_LOG_URL) return;
  fetch(RSVP_LOG_URL, {
    method: 'POST', mode: 'no-cors',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify(datos)
  }).catch(()=>{});
}

// --- Render ---
document.getElementById('kid-name').textContent = CONFIG.nombre;
document.getElementById('edad-tag').textContent = CONFIG.edadTexto;
document.getElementById('the-date').textContent = CONFIG.fechaTexto;
document.getElementById('footer-name').textContent = CONFIG.nombre;
document.getElementById('footer-note').textContent = CONFIG.footerNota;
document.getElementById('venue-name').textContent = CONFIG.lugarNombre;
document.getElementById('venue-addr').textContent = CONFIG.lugarDireccion;
document.getElementById('maps-btn').href = CONFIG.mapsUrl;
document.getElementById('nota-text').textContent = CONFIG.nota;
document.getElementById('mensaje-texto').textContent = CONFIG.mensaje;
document.getElementById('mensaje-firma').textContent = CONFIG.mensajeFirma;
document.getElementById('rsvp-note').textContent = CONFIG.rsvpNota;
document.getElementById('rsvp-btn').addEventListener('click', function(e){
  e.preventDefault();
  const nombreInvitado = (document.getElementById('rsvp-nombre').value || '').trim() || 'Un invitado';
  const mensaje = `Soy ${nombreInvitado}. ${CONFIG.whatsappMensaje}`;
  registrarRSVP({ evento: document.title, invitado: nombreInvitado, fechaEvento: CONFIG.fechaTexto || '' });
  window.open(`https://wa.me/${CONFIG.whatsappNumero}?text=${encodeURIComponent(mensaje)}`, '_blank', 'noopener');
});

const itList = document.getElementById('itinerary-list');
CONFIG.itinerario.forEach(item=>{
  const div = document.createElement('div');
  div.className = 'itinerary-item';
  div.innerHTML = `<div class="itinerary-time">${item.hora}</div><div class="itinerary-what">${item.que}</div>`;
  itList.appendChild(div);
});

const gallery = document.getElementById('gallery-grid');
for(let i=0;i<CONFIG.fotos;i++){
  const ph = document.createElement('div');
  ph.className = 'ph';
  ph.textContent = 'Foto ' + (i+1);
  gallery.appendChild(ph);
}

// --- Elementos flotantes (joystick/control/invasor/rayo) ---
(function(){
  const container = document.getElementById('floaties');
  const emojis = ['🎮', '🕹️', '👾', '⚡'];
  const count = 10;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'floatie';
    const size = 16 + Math.random()*16;
    el.style.left = (Math.random()*94) + '%';
    el.style.fontSize = size + 'px';
    el.textContent = emojis[i % emojis.length];
    el.style.animationDuration = (13 + Math.random()*10) + 's';
    el.style.animationDelay = (Math.random()*14) + 's';
    container.appendChild(el);
  }
})();

// --- Título con efecto de tipeo ---
(function(){
  const el = document.getElementById('typedTitle');
  const text = CONFIG.tituloTipeo;
  let i = 0;
  function typeNext(){
    if(i >= text.length){ el.classList.add('done'); return; }
    const ch = text[i];
    const span = document.createElement('span');
    span.className = 'ch' + (ch === ' ' ? ' space' : '');
    span.textContent = ch === ' ' ? ' ' : ch;
    el.appendChild(span);
    i++;
    setTimeout(typeNext, 90);
  }
  setTimeout(typeNext, 500);
})();

// --- Countdown ---
function tick(){
  const target = new Date(CONFIG.fechaCountdown);
  const now = new Date();
  let diff = Math.max(0, target - now);
  document.getElementById('cd-d').textContent = String(Math.floor(diff/(1000*60*60*24))).padStart(2,'0');
  document.getElementById('cd-h').textContent = String(Math.floor((diff/(1000*60*60))%24)).padStart(2,'0');
  document.getElementById('cd-m').textContent = String(Math.floor((diff/(1000*60))%60)).padStart(2,'0');
  document.getElementById('cd-s').textContent = String(Math.floor((diff/1000)%60)).padStart(2,'0');
}
tick(); setInterval(tick, 1000);

// --- Fade up on scroll ---
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
}, {threshold:0.25});
document.querySelectorAll('.fade-up').forEach(el=>observer.observe(el));
</script>
</body>
</html>
