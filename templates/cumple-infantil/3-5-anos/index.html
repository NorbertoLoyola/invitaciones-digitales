<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFF8E8">
<title>Cumple selva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     MOTOR DE PLANTILLA — CONFIG
     Todo el contenido editable vive en el objeto CONFIG (abajo,
     dentro del <script>). Los estilos de acá no deberían tocarse
     para generar una invitación nueva: sólo se edita CONFIG.
     Tema: selva/animalitos genéricos (sin personajes con marca),
     pensado para 3-5 años. Motivos vía emoji (🍃🦋🐾) — sin
     depender de clip art con licencia.
     ============================================================ */

  :root{
    --crema: #FFF8E8;
    --verde: #3FA34D;
    --verde-osc: #2B7A38;
    --amarillo: #FFC93C;
    --turquesa: #2EC4B6;
    --coral: #FF6B4A;
    --texto: #3A3020;
    --texto-suave: #6B6048;
    color-scheme: light;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; color-scheme:light; background:var(--crema); }
  body{
    font-family:'Baloo 2', sans-serif;
    font-weight:500;
    color:var(--texto);
    color-scheme:light;
    background:
      radial-gradient(circle at 10% 8%, rgba(255,255,255,0.65), transparent 35%),
      radial-gradient(circle at 92% 22%, rgba(255,255,255,0.5), transparent 40%),
      radial-gradient(circle at 15% 85%, rgba(255,255,255,0.4), transparent 40%),
      linear-gradient(180deg, var(--crema) 0%, #FDEFC7 55%, #F7E4A8 140%);
    background-attachment:fixed;
    overflow-x:hidden;
    position:relative;
  }

  h1,h2{ font-family:'Baloo 2', sans-serif; font-weight:800; margin:0; }

  .wrap{ max-width:480px; margin:0 auto; position:relative; z-index:1; }

  section{ padding:64px 30px; text-align:center; position:relative; z-index:1; }

  .fade-up{ opacity:0; transform:translateY(22px); transition:opacity .9s ease, transform .9s ease; }
  .fade-up.visible{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){ .fade-up{ opacity:1; transform:none; transition:none; } .floatie{ display:none; } }

  /* ---------- Elementos flotantes de fondo (hojas/mariposas/huellitas) ---------- */
  .floaties{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .floatie{
    position:absolute; bottom:-12%; opacity:0; line-height:1;
    animation-name: floatUp; animation-timing-function: ease-in; animation-iteration-count: infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:.7; }
    92%{ opacity:.55; }
    100%{ transform:translateY(-112vh) translateX(30px) rotate(25deg); opacity:0; }
  }

  /* ---------- Hero ---------- */
  #hero{ min-height:92vh; display:flex; flex-direction:column; justify-content:center; padding-top:44px; }

  .typed-title{
    position:relative; display:inline-block;
    font-size:1rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--verde-osc); margin-bottom:8px; min-height:1.4em;
  }
  .typed-title .ch{ display:inline-block; opacity:0; transform:translateY(6px); animation:chIn .35s ease forwards; }
  .typed-title .ch.space{ width:.35em; }
  @keyframes chIn{ to{ opacity:1; transform:translateY(0); } }
  .typed-title::after{
    content:""; display:inline-block; width:2px; height:1em;
    background:var(--coral); margin-left:3px; vertical-align:-2px;
    animation:caretBlink .8s steps(1) infinite;
  }
  .typed-title.done::after{ animation:none; opacity:0; }
  @keyframes caretBlink{ 50%{ opacity:0; } }

  .kid-name{ font-size:4rem; line-height:1; font-weight:800; color:var(--coral); margin:8px 0 6px; -webkit-text-stroke:2px var(--verde-osc); }
  .edad-tag{ display:inline-block; background:var(--turquesa); color:#fff; font-weight:700; font-size:.9rem; padding:6px 18px; border-radius:20px; margin-bottom:14px; }
  .the-date{ font-size:1rem; font-weight:600; letter-spacing:.04em; color:var(--texto); }
  .scroll-hint{ margin-top:52px; font-size:.72rem; letter-spacing:.15em; text-transform:uppercase; color:var(--verde-osc); opacity:.85; }

  .divider{ width:60px; height:4px; border-radius:3px; background:var(--amarillo); margin:0 auto; opacity:.8; }

  /* ---------- Countdown ---------- */
  .countdown{ display:flex; justify-content:center; gap:14px; margin-top:26px; }
  .cd-box{ min-width:56px; background:#fff; border:3px solid var(--turquesa); border-radius:14px; padding:10px 4px; }
  .cd-num{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:1.7rem; color:var(--verde-osc); }
  .cd-label{ font-size:.6rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--texto-suave); }

  /* ---------- Itinerario / lugar ---------- */
  .itinerary-item{ display:flex; align-items:flex-start; gap:16px; text-align:left; max-width:300px; margin:0 auto 22px; }
  .itinerary-time{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:1.05rem; color:var(--coral); min-width:60px; }
  .itinerary-what{ font-size:.92rem; font-weight:500; }

  .venue-name{ font-size:1.25rem; font-weight:700; color:var(--verde-osc); margin-top:6px; }
  .venue-addr{ font-size:.85rem; color:var(--texto-suave); margin-top:4px; }

  .btn{
    display:inline-block; margin-top:20px; padding:13px 30px;
    background:var(--verde); color:#fff;
    text-decoration:none; font-weight:700; font-size:.82rem; letter-spacing:.03em;
    border-radius:24px; transition:background .25s ease, transform .15s ease;
  }
  .btn:hover{ background:var(--verde-osc); transform:translateY(-1px); }
  .btn.outline{ background:transparent; border:3px solid var(--verde); color:var(--verde-osc); }

  .nota-tag{ display:inline-block; padding:12px 20px; background:#fff; border:3px dashed var(--amarillo); border-radius:16px; font-size:.88rem; font-weight:500; margin-top:10px; max-width:300px; line-height:1.5; }

  .gallery{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:24px; }
  .ph{ aspect-ratio:1; background:#fff; border:3px dashed var(--turquesa); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:600; color:var(--texto-suave); letter-spacing:.04em; text-align:center; padding:8px; }

  .mensaje-texto{ font-size:1rem; font-weight:500; line-height:1.8; max-width:310px; margin:20px auto 0; color:var(--texto); }
  .mensaje-firma{ font-weight:800; font-size:1.5rem; color:var(--coral); margin-top:12px; }

  .rsvp-note{ font-size:.85rem; color:var(--texto-suave); max-width:280px; margin:14px auto 0; line-height:1.6; }
  .rsvp-input{ display:block; width:100%; max-width:260px; margin:14px auto 0; padding:11px 16px; border-radius:24px; border:1.5px solid currentColor; font-family:inherit; font-size:.88rem; text-align:center; background:rgba(255,255,255,.7); color:inherit; }
  .rsvp-input::placeholder{ color:inherit; opacity:.55; }

  footer{ padding:56px 30px 76px; text-align:center; }
  footer .footer-name{ font-weight:800; font-size:2.1rem; color:var(--verde-osc); }

  .config-flag{
    position:fixed; bottom:10px; right:10px; background:var(--verde-osc); color:#fff;
    font-size:.6rem; padding:4px 8px; border-radius:8px; opacity:.6; font-family:'Baloo 2',sans-serif; z-index:5;
  }
</style>
</head>
<body>

<div class="floaties" id="floaties"></div>

<div class="wrap">
  <section id="hero" class="fade-up">
    <div class="typed-title" id="typedTitle"></div>
    <h1 class="kid-name" id="kid-name"></h1>
    <div class="edad-tag" id="edad-tag"></div>
    <div class="the-date" id="the-date"></div>
    <div class="scroll-hint">Deslizá para ver más ↓</div>
  </section>

  <div class="divider"></div>

  <section id="countdown-section" class="fade-up">
    <h2>Falta poco 🌴</h2>
    <div class="countdown">
      <div class="cd-box"><div class="cd-num" id="cd-d">00</div><div class="cd-label">días</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-h">00</div><div class="cd-label">hs</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-m">00</div><div class="cd-label">min</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-s">00</div><div class="cd-label">seg</div></div>
    </div>
  </section>

  <div class="divider"></div>

  <section id="itinerary-section" class="fade-up">
    <h2>La aventura</h2>
    <div id="itinerary-list" style="margin-top:26px;"></div>
    <div class="venue-name" id="venue-name"></div>
    <div class="venue-addr" id="venue-addr"></div>
    <a class="btn outline" id="maps-btn" href="#" target="_blank" rel="noopener">Cómo llegar</a>
  </section>

  <div class="divider"></div>

  <section id="nota-section" class="fade-up">
    <h2>Un dato</h2>
    <div class="nota-tag" id="nota-text"></div>
  </section>

  <div class="divider"></div>

  <section id="gallery-section" class="fade-up">
    <h2>Momentos</h2>
    <div class="gallery" id="gallery-grid"></div>
  </section>

  <div class="divider"></div>

  <section id="mensaje-section" class="fade-up">
    <h2>Nuestro mensaje</h2>
    <p class="mensaje-texto" id="mensaje-texto"></p>
    <div class="mensaje-firma" id="mensaje-firma"></div>
  </section>

  <div class="divider"></div>

  <section id="rsvp-section" class="fade-up">
    <h2>Confirmá tu asistencia</h2>
    <p class="rsvp-note" id="rsvp-note"></p>
    <input type="text" class="rsvp-input" id="rsvp-nombre" placeholder="Tu nombre" autocomplete="name">
    <a class="btn" id="rsvp-btn" href="#" target="_blank" rel="noopener">Confirmar por WhatsApp</a>
  </section>

  <footer class="fade-up">
    <div class="footer-name" id="footer-name"></div>
    <p style="font-size:.85rem; color:var(--texto-suave); margin-top:10px;" id="footer-note"></p>
  </footer>
</div>

<div class="config-flag">TEMPLATE · cumple-infantil-3-5-anos-selva v1</div>

<script>
/* ============================================================
   CONFIG — esto es lo único que se edita por cada cliente.
   ============================================================ */
const CONFIG = {
  nombre: "Bruno",
  tituloTipeo: "¡Nos vamos de safari!",
  edadTexto: "Cumple 4 años",
  fechaTexto: "12 de Octubre, 2026",
  fechaCountdown: "2026-10-12T16:00:00",
  itinerario: [
    { hora: "16:00", que: "Recepción y bienvenida" },
    { hora: "16:30", que: "Juegos y pintacaritas" },
    { hora: "18:00", que: "Torta y mesa dulce" },
    { hora: "19:30", que: "Cierre" },
  ],
  lugarNombre: "Salón La Jungla",
  lugarDireccion: "Av. Rivadavia 3200, Buenos Aires",
  mapsUrl: "https://maps.google.com/?q=Salon+La+Jungla",
  nota: "Va a haber juegos, pintacaritas y una mesa dulce con toda la onda selvática 🌴. ¡Vení con ropa cómoda para jugar!",
  fotos: 4,
  mensaje: "Bruno está súper entusiasmado por celebrar sus 4 años rodeado de sus amigos y su familia. ¡Nos encantaría que nos acompañes en esta aventura!",
  mensajeFirma: "Con cariño, Mamá y Papá",
  rsvpNota: "Por favor confirmá la asistencia antes del 1 de Octubre para organizar todo con cariño.",
  whatsappNumero: "5491100000000",
  whatsappMensaje: "¡Hola! Confirmo mi asistencia al cumple de Bruno 🐾",
  footerNota: "Gracias por ser parte de este día.",
};

// --- Registro de RSVP (Fase 2 del plan comercial: Google Sheet + Apps Script) ---
const RSVP_LOG_URL = ""; // completar con la URL del Apps Script una vez desplegado (ver rsvp-apps-script.md)
function registrarRSVP(datos){
  if(!RSVP_LOG_URL) return;
  fetch(RSVP_LOG_URL, {
    method: 'POST', mode: 'no-cors',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify(datos)
  }).catch(()=>{});
}

// --- Render ---
document.getElementById('kid-name').textContent = CONFIG.nombre;
document.getElementById('edad-tag').textContent = CONFIG.edadTexto;
document.getElementById('the-date').textContent = CONFIG.fechaTexto;
document.getElementById('footer-name').textContent = CONFIG.nombre;
document.getElementById('footer-note').textContent = CONFIG.footerNota;
document.getElementById('venue-name').textContent = CONFIG.lugarNombre;
document.getElementById('venue-addr').textContent = CONFIG.lugarDireccion;
document.getElementById('maps-btn').href = CONFIG.mapsUrl;
document.getElementById('nota-text').textContent = CONFIG.nota;
document.getElementById('mensaje-texto').textContent = CONFIG.mensaje;
document.getElementById('mensaje-firma').textContent = CONFIG.mensajeFirma;
document.getElementById('rsvp-note').textContent = CONFIG.rsvpNota;
document.getElementById('rsvp-btn').addEventListener('click', function(e){
  e.preventDefault();
  const nombreInvitado = (document.getElementById('rsvp-nombre').value || '').trim() || 'Un invitado';
  const mensaje = `Soy ${nombreInvitado}. ${CONFIG.whatsappMensaje}`;
  registrarRSVP({ evento: document.title, invitado: nombreInvitado, fechaEvento: CONFIG.fechaTexto || '' });
  window.open(`https://wa.me/${CONFIG.whatsappNumero}?text=${encodeURIComponent(mensaje)}`, '_blank', 'noopener');
});

const itList = document.getElementById('itinerary-list');
CONFIG.itinerario.forEach(item=>{
  const div = document.createElement('div');
  div.className = 'itinerary-item';
  div.innerHTML = `<div class="itinerary-time">${item.hora}</div><div class="itinerary-what">${item.que}</div>`;
  itList.appendChild(div);
});

const gallery = document.getElementById('gallery-grid');
for(let i=0;i<CONFIG.fotos;i++){
  const ph = document.createElement('div');
  ph.className = 'ph';
  ph.textContent = 'Foto ' + (i+1);
  gallery.appendChild(ph);
}

// --- Elementos flotantes (hojas/mariposas/huellitas) ---
(function(){
  const container = document.getElementById('floaties');
  const emojis = ['🍃', '🦋', '🐾', '🌿'];
  const count = 10;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'floatie';
    const size = 16 + Math.random()*16;
    el.style.left = (Math.random()*94) + '%';
    el.style.fontSize = size + 'px';
    el.textContent = emojis[i % emojis.length];
    el.style.animationDuration = (13 + Math.random()*10) + 's';
    el.style.animationDelay = (Math.random()*14) + 's';
    container.appendChild(el);
  }
})();

// --- Título con efecto de tipeo ---
(function(){
  const el = document.getElementById('typedTitle');
  const text = CONFIG.tituloTipeo;
  let i = 0;
  function typeNext(){
    if(i >= text.length){ el.classList.add('done'); return; }
    const ch = text[i];
    const span = document.createElement('span');
    span.className = 'ch' + (ch === ' ' ? ' space' : '');
    span.textContent = ch === ' ' ? ' ' : ch;
    el.appendChild(span);
    i++;
    setTimeout(typeNext, 130);
  }
  setTimeout(typeNext, 500);
})();

// --- Countdown ---
function tick(){
  const target = new Date(CONFIG.fechaCountdown);
  const now = new Date();
  let diff = Math.max(0, target - now);
  document.getElementById('cd-d').textContent = String(Math.floor(diff/(1000*60*60*24))).padStart(2,'0');
  document.getElementById('cd-h').textContent = String(Math.floor((diff/(1000*60*60))%24)).padStart(2,'0');
  document.getElementById('cd-m').textContent = String(Math.floor((diff/(1000*60))%60)).padStart(2,'0');
  document.getElementById('cd-s').textContent = String(Math.floor((diff/1000)%60)).padStart(2,'0');
}
tick(); setInterval(tick, 1000);

// --- Fade up on scroll ---
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
}, {threshold:0.25});
document.querySelectorAll('.fade-up').forEach(el=>observer.observe(el));
</script>
</body>
</html>
