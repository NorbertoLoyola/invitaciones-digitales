<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#F7F3ED">
<title>¿Niño o niña?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     MOTOR DE PLANTILLA — CONFIG
     Todo el contenido editable vive en el objeto CONFIG (abajo,
     dentro del <script>). Los estilos de acá no deberían tocarse
     para generar una invitación nueva: sólo se edita CONFIG.
     Variante REVEAL de baby shower — protagonizada por una tarjeta
     que se da vuelta (flip 3D) al tocarla, revelando "¿niño o
     niña?". El resultado (CONFIG.revelado) es configurable.
     ============================================================ */

  :root{
    --crema: #F7F3ED;
    --carbon: #4A4038;
    --carbon-suave: #857A6E;
    --celeste: #A9C9DE;
    --celeste-osc: #6E9CBC;
    --rosa: #E9AFC0;
    --rosa-osc: #C9748C;
    --dorado: #C9A66B;
    color-scheme: light;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; color-scheme:light; background:var(--crema); }
  body{
    font-family:'Jost', sans-serif;
    font-weight:300;
    color:var(--carbon);
    color-scheme:light;
    background:linear-gradient(180deg, var(--crema) 0%, #F1E9DD 55%, #E9DEC9 140%);
    overflow-x:hidden;
    position:relative;
  }

  h1,h2{ font-family:'Fraunces', serif; font-weight:600; margin:0; }

  .wrap{ max-width:480px; margin:0 auto; position:relative; z-index:1; }
  section{ padding:60px 28px; text-align:center; }

  .fade-up{ opacity:0; transform:translateY(22px); transition:opacity .9s ease, transform .9s ease; }
  .fade-up.visible{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){ .fade-up{ opacity:1; transform:none; transition:none; } .floatie{ display:none; } }

  .floaties{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .floatie{ position:absolute; bottom:-12%; opacity:0; line-height:1; animation-name:floatUp; animation-timing-function:ease-in; animation-iteration-count:infinite; }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:.6; }
    92%{ opacity:.45; }
    100%{ transform:translateY(-112vh) translateX(24px) rotate(10deg); opacity:0; }
  }

  #hero{ min-height:88vh; display:flex; flex-direction:column; justify-content:center; padding-top:44px; }
  .eyebrow{ letter-spacing:.2em; text-transform:uppercase; font-size:.72rem; color:var(--dorado); margin-bottom:14px; }
  .mama-name{ font-size:2.6rem; line-height:1.1; color:var(--carbon); }
  .the-date{ margin-top:14px; font-size:1rem; letter-spacing:.06em; color:var(--carbon); }

  /* ---------- Tarjeta flip ---------- */
  .flip-zone{ margin-top:36px; perspective:1400px; }
  .flip-card{
    width:260px; height:260px; margin:0 auto; position:relative;
    transform-style:preserve-3d; transition:transform 1s cubic-bezier(.6,0,.3,1);
    cursor:pointer;
  }
  .flip-card.girado{ transform:rotateY(180deg); }
  .flip-cara{
    position:absolute; inset:0; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    backface-visibility:hidden; box-shadow:0 20px 40px rgba(74,64,56,0.18);
  }
  .flip-frente{
    background:linear-gradient(160deg, var(--celeste), var(--rosa));
  }
  .flip-frente .signo{ font-family:'Fraunces', serif; font-size:4rem; color:#fff; }
  .flip-frente .hint{ margin-top:10px; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,0.9); }
  .flip-dorso{
    transform:rotateY(180deg);
    background:#fff; border:3px solid var(--dorado);
  }
  .flip-dorso .resultado-texto{ font-family:'Fraunces', serif; font-size:1.7rem; }
  .flip-dorso .resultado-sub{ margin-top:8px; font-size:.8rem; color:var(--carbon-suave); }

  .scroll-hint{ margin-top:40px; font-size:.72rem; letter-spacing:.15em; text-transform:uppercase; color:var(--dorado); opacity:.85; }

  .divider{ width:1px; height:50px; background:var(--dorado); margin:0 auto; opacity:.5; }

  .countdown{ display:flex; justify-content:center; gap:16px; margin-top:26px; }
  .cd-box{ min-width:56px; }
  .cd-num{ font-family:'Fraunces', serif; font-size:2rem; color:var(--carbon); }
  .cd-label{ font-size:.6rem; letter-spacing:.15em; text-transform:uppercase; color:var(--dorado); }

  .itinerary-item{ display:flex; align-items:flex-start; gap:16px; text-align:left; max-width:300px; margin:0 auto 22px; }
  .itinerary-time{ font-family:'Fraunces', serif; font-size:1.1rem; color:var(--dorado); min-width:60px; }
  .itinerary-what{ font-size:.92rem; }

  .venue-name{ font-size:1.25rem; color:var(--carbon); margin-top:6px; }
  .venue-addr{ font-size:.85rem; color:var(--carbon-suave); margin-top:4px; }

  .btn{
    display:inline-block; margin-top:20px; padding:13px 30px;
    background:var(--carbon); color:var(--crema);
    text-decoration:none; font-size:.78rem; letter-spacing:.1em;
    text-transform:uppercase; border-radius:2px;
    transition:background .25s ease;
  }
  .btn:hover{ background:var(--dorado); }
  .btn.outline{ background:transparent; border:1px solid var(--carbon); color:var(--carbon); }

  .nota-tag{ display:inline-block; padding:10px 20px; border:1px solid var(--dorado); border-radius:20px; font-size:.85rem; margin-top:10px; max-width:300px; line-height:1.5; }

  .mensaje-texto{ font-size:1rem; line-height:1.8; max-width:310px; margin:20px auto 0; color:#3a332a; font-style:italic; }
  .mensaje-firma{ font-family:'Fraunces', serif; font-style:italic; font-size:1.4rem; color:var(--dorado); margin-top:14px; }

  .rsvp-note{ font-size:.85rem; color:var(--carbon-suave); max-width:280px; margin:14px auto 0; line-height:1.6; }
  .rsvp-input{ display:block; width:100%; max-width:260px; margin:14px auto 0; padding:11px 16px; border-radius:24px; border:1.5px solid currentColor; font-family:inherit; font-size:.88rem; text-align:center; background:rgba(255,255,255,.7); color:inherit; }
  .rsvp-input::placeholder{ color:inherit; opacity:.55; }

  footer{ padding:56px 30px 76px; text-align:center; }
  footer .footer-name{ font-family:'Fraunces', serif; font-style:italic; font-size:1.9rem; color:var(--dorado); }

  .config-flag{
    position:fixed; bottom:10px; right:10px; background:var(--carbon); color:var(--crema);
    font-size:.6rem; padding:4px 8px; border-radius:3px; opacity:.55; font-family:'Jost',sans-serif; z-index:5;
  }
</style>
</head>
<body>

<div class="floaties" id="floaties"></div>

<div class="wrap">
  <section id="hero" class="fade-up">
    <div class="eyebrow" id="eyebrow-text"></div>
    <h1 class="mama-name" id="mama-name"></h1>
    <div class="the-date" id="the-date"></div>

    <div class="flip-zone">
      <div class="flip-card" id="flip-card">
        <div class="flip-cara flip-frente">
          <div class="signo">?</div>
          <div class="hint">Tocá para revelar</div>
        </div>
        <div class="flip-cara flip-dorso">
          <div class="resultado-texto" id="resultado-texto"></div>
          <div class="resultado-sub" id="resultado-sub"></div>
        </div>
      </div>
    </div>

    <div class="scroll-hint">Deslizá para ver más ↓</div>
  </section>

  <div class="divider"></div>

  <section id="countdown-section" class="fade-up">
    <h2>Falta poco</h2>
    <div class="countdown">
      <div class="cd-box"><div class="cd-num" id="cd-d">00</div><div class="cd-label">días</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-h">00</div><div class="cd-label">hs</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-m">00</div><div class="cd-label">min</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-s">00</div><div class="cd-label">seg</div></div>
    </div>
  </section>

  <div class="divider"></div>

  <section id="itinerary-section" class="fade-up">
    <h2>La revelación</h2>
    <div id="itinerary-list" style="margin-top:26px;"></div>
    <div class="venue-name" id="venue-name"></div>
    <div class="venue-addr" id="venue-addr"></div>
    <a class="btn outline" id="maps-btn" href="#" target="_blank" rel="noopener">Cómo llegar</a>
  </section>

  <div class="divider"></div>

  <section id="nota-section" class="fade-up">
    <h2>Un dato</h2>
    <div class="nota-tag" id="nota-text"></div>
  </section>

  <div class="divider"></div>

  <section id="mensaje-section" class="fade-up">
    <h2>Nuestro mensaje</h2>
    <p class="mensaje-texto" id="mensaje-texto"></p>
    <div class="mensaje-firma" id="mensaje-firma"></div>
  </section>

  <div class="divider"></div>

  <section id="rsvp-section" class="fade-up">
    <h2>Confirmá tu asistencia</h2>
    <p class="rsvp-note" id="rsvp-note"></p>
    <input type="text" class="rsvp-input" id="rsvp-nombre" placeholder="Tu nombre" autocomplete="name">
    <a class="btn" id="rsvp-btn" href="#" target="_blank" rel="noopener">Confirmar por WhatsApp</a>
  </section>

  <footer class="fade-up">
    <div class="footer-name" id="footer-name"></div>
    <p style="font-size:.85rem; color:var(--carbon-suave); margin-top:10px;" id="footer-note"></p>
  </footer>
</div>

<div class="config-flag">TEMPLATE · baby-shower-reveal v1</div>

<script>
/* ============================================================
   CONFIG — esto es lo único que se edita por cada cliente.

   revelado: "nino" | "nina" | "sorpresa" — controla qué muestra
   el dorso de la tarjeta al girarla. "sorpresa" deja el signo de
   pregunta también del otro lado, para cuando el reveal es en
   vivo en el evento y la invitación no debe develarlo.
   ============================================================ */
const CONFIG = {
  nombreMama: "Camila",
  eyebrow: "Gender Reveal",
  fechaTexto: "20 de Septiembre, 2026",
  fechaCountdown: "2026-09-20T17:00:00",
  revelado: "nina",
  itinerario: [
    { hora: "17:00", que: "Recepción de invitados" },
    { hora: "17:30", que: "Juegos" },
    { hora: "18:30", que: "El gran momento: la revelación" },
    { hora: "19:30", que: "Torta y brindis" },
  ],
  lugarNombre: "Casa de la familia Ruiz",
  lugarDireccion: "Av. Rivadavia 3200, Buenos Aires",
  mapsUrl: "https://maps.google.com/?q=Av+Rivadavia+3200+Buenos+Aires",
  nota: "El color de tu ropa no hace falta que combine con nada — el secreto lo guardamos nosotros 😉",
  mensaje: "¡Ya falta poco para saber si es nene o nena! Nos encantaría compartir este momento tan especial con las personas que más queremos.",
  mensajeFirma: "Camila",
  rsvpNota: "Por favor confirmá tu asistencia antes del 10 de Septiembre para organizar todo con cariño.",
  whatsappNumero: "5491100000000",
  whatsappMensaje: "¡Hola! Confirmo mi asistencia al gender reveal de Camila 💙💗",
  footerNota: "Gracias por acompañarnos en esta espera.",
};

const RESULTADOS = {
  nino: { texto: '¡Es un niño!', sub: 'Va a ser un varón 💙', color1: 'var(--celeste)', color2: 'var(--celeste-osc)' },
  nina: { texto: '¡Es una niña!', sub: 'Va a ser una nena 💗', color1: 'var(--rosa)', color2: 'var(--rosa-osc)' },
  sorpresa: { texto: '¡Sorpresa en vivo!', sub: 'Lo develamos en el evento', color1: 'var(--dorado)', color2: 'var(--carbon)' },
};

// --- Registro de RSVP (Fase 2 del plan comercial: Google Sheet + Apps Script) ---
const RSVP_LOG_URL = ""; // completar con la URL del Apps Script una vez desplegado (ver rsvp-apps-script.md)
function registrarRSVP(datos){
  if(!RSVP_LOG_URL) return;
  fetch(RSVP_LOG_URL, {
    method: 'POST', mode: 'no-cors',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify(datos)
  }).catch(()=>{});
}

// --- Render ---
document.getElementById('eyebrow-text').textContent = CONFIG.eyebrow;
document.getElementById('mama-name').textContent = CONFIG.nombreMama;
document.getElementById('the-date').textContent = CONFIG.fechaTexto;
document.getElementById('footer-name').textContent = CONFIG.nombreMama;
document.getElementById('footer-note').textContent = CONFIG.footerNota;
document.getElementById('venue-name').textContent = CONFIG.lugarNombre;
document.getElementById('venue-addr').textContent = CONFIG.lugarDireccion;
document.getElementById('maps-btn').href = CONFIG.mapsUrl;
document.getElementById('nota-text').textContent = CONFIG.nota;
document.getElementById('mensaje-texto').textContent = CONFIG.mensaje;
document.getElementById('mensaje-firma').textContent = CONFIG.mensajeFirma;
document.getElementById('rsvp-note').textContent = CONFIG.rsvpNota;
document.getElementById('rsvp-btn').addEventListener('click', function(e){
  e.preventDefault();
  const nombreInvitado = (document.getElementById('rsvp-nombre').value || '').trim() || 'Un invitado';
  const mensaje = `Soy ${nombreInvitado}. ${CONFIG.whatsappMensaje}`;
  registrarRSVP({ evento: document.title, invitado: nombreInvitado, fechaEvento: CONFIG.fechaTexto || '' });
  window.open(`https://wa.me/${CONFIG.whatsappNumero}?text=${encodeURIComponent(mensaje)}`, '_blank', 'noopener');
});

const r = RESULTADOS[CONFIG.revelado];
document.getElementById('resultado-texto').textContent = r.texto;
document.getElementById('resultado-sub').textContent = r.sub;
document.querySelector('.flip-dorso').style.background = `linear-gradient(160deg, ${r.color1}, ${r.color2})`;
document.querySelector('.flip-dorso .resultado-texto').style.color = '#fff';
document.querySelector('.flip-dorso .resultado-sub').style.color = 'rgba(255,255,255,0.9)';

const itList = document.getElementById('itinerary-list');
CONFIG.itinerario.forEach(item=>{
  const div = document.createElement('div');
  div.className = 'itinerary-item';
  div.innerHTML = `<div class="itinerary-time">${item.hora}</div><div class="itinerary-what">${item.que}</div>`;
  itList.appendChild(div);
});

// --- Flip card ---
document.getElementById('flip-card').addEventListener('click', function(){
  this.classList.toggle('girado');
});

// --- Elementos flotantes ---
(function(){
  const container = document.getElementById('floaties');
  const emojis = ['✨', '🍼', '⭐', '☁️'];
  const count = 9;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'floatie';
    const size = 15 + Math.random()*15;
    el.style.left = (Math.random()*94) + '%';
    el.style.fontSize = size + 'px';
    el.textContent = emojis[i % emojis.length];
    el.style.animationDuration = (14 + Math.random()*10) + 's';
    el.style.animationDelay = (Math.random()*14) + 's';
    container.appendChild(el);
  }
})();

// --- Countdown ---
function tick(){
  const target = new Date(CONFIG.fechaCountdown);
  const now = new Date();
  let diff = Math.max(0, target - now);
  document.getElementById('cd-d').textContent = String(Math.floor(diff/(1000*60*60*24))).padStart(2,'0');
  document.getElementById('cd-h').textContent = String(Math.floor((diff/(1000*60*60))%24)).padStart(2,'0');
  document.getElementById('cd-m').textContent = String(Math.floor((diff/(1000*60))%60)).padStart(2,'0');
  document.getElementById('cd-s').textContent = String(Math.floor((diff/1000)%60)).padStart(2,'0');
}
tick(); setInterval(tick, 1000);

// --- Fade up on scroll ---
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
}, {threshold:0.25});
document.querySelectorAll('.fade-up').forEach(el=>observer.observe(el));
</script>
</body>
</html>
