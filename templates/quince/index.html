<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark only">
<meta name="theme-color" content="#1E1420">
<title>Mis 15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     MOTOR DE PLANTILLA — CONFIG
     Todo el contenido editable vive en el objeto CONFIG (abajo).
     Los estilos no se tocan para generar una invitación nueva.
     ============================================================ */

  :root{
    --noche: #1E1420;
    --noche-suave: #2A1B2E;
    --champagne: #C9A66B;
    --rosa: #C97B92;
    --magenta: #8C2F52;
    --crema: #F3E9DD;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background: var(--noche);
    color: var(--crema);
    font-family:'Manrope', sans-serif;
    font-weight:300;
    overflow-x:hidden;
  }
  h1,h2{ font-family:'Bodoni Moda', serif; font-weight:500; margin:0; }

  .wrap{ max-width:480px; margin:0 auto; position:relative; }

  section{ padding:76px 32px; text-align:center; position:relative; }

  .fade-up{ opacity:0; transform:translateY(24px); transition:opacity .9s ease, transform .9s ease; }
  .fade-up.visible{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){ .fade-up{ opacity:1; transform:none; transition:none; } }

  /* --- Firma visual: el "15" como reflector ---
     El número protagonista de la fiesta se muestra enorme detrás
     del nombre, con un halo de luz cálida (spotlight) que respira
     suavemente — como si fuera el foco central del salón. Es el
     único elemento con movimiento propio; el resto queda quieto. */
  #hero{ min-height:94vh; display:flex; flex-direction:column; justify-content:center; padding-top:40px; }
  .spotlight-num{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-58%);
    font-size:13rem; font-weight:700; color: rgba(201,166,107,0.14);
    z-index:0; line-height:1; user-select:none;
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ opacity:.6; } 50%{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .spotlight-num{ animation:none; opacity:.8; } }

  .eyebrow{ position:relative; z-index:1; letter-spacing:.3em; text-transform:uppercase; font-size:.68rem; color:var(--rosa); margin-bottom:16px; }
  .quince-name{ position:relative; z-index:1; font-size:3rem; color:var(--crema); line-height:1.05; }
  .the-date{ position:relative; z-index:1; margin-top:20px; font-size:1rem; letter-spacing:.1em; color:var(--champagne); }
  .scroll-hint{ position:relative; z-index:1; margin-top:52px; font-size:.72rem; letter-spacing:.15em; text-transform:uppercase; color:var(--rosa); }

  .divider{ width:60px; height:1px; background: var(--champagne); margin:0 auto; opacity:.5; }

  .countdown{ display:flex; justify-content:center; gap:16px; margin-top:26px; }
  .cd-box{ min-width:56px; }
  .cd-num{ font-family:'Bodoni Moda', serif; font-size:2rem; color:var(--champagne); }
  .cd-label{ font-size:.58rem; letter-spacing:.15em; text-transform:uppercase; color:var(--rosa); }

  .itinerary-item{ display:flex; align-items:flex-start; gap:16px; text-align:left; max-width:300px; margin:0 auto 24px; }
  .itinerary-time{ font-family:'Bodoni Moda', serif; font-size:1.1rem; color:var(--champagne); min-width:60px; }
  .itinerary-what{ font-size:.92rem; color:var(--crema); opacity:.9; }

  .venue-name{ font-size:1.3rem; color:var(--champagne); margin-top:6px; }
  .venue-addr{ font-size:.82rem; color:#c9bfae; margin-top:4px; }

  .btn{
    display:inline-block; margin-top:20px; padding:13px 30px;
    background: var(--magenta); color: var(--crema);
    text-decoration:none; font-size:.76rem; letter-spacing:.12em;
    text-transform:uppercase; border-radius:2px;
    transition: background .25s ease;
  }
  .btn:hover{ background: var(--rosa); color: var(--noche); }
  .btn.outline{ background:transparent; border:1px solid var(--champagne); color:var(--champagne); }

  .dresscode-tag{ display:inline-block; padding:6px 18px; border:1px solid var(--rosa); border-radius:20px; font-size:.78rem; margin-top:10px; color:var(--rosa); }

  .padrinos{ margin-top:20px; }
  .padrino-item{ font-size:.95rem; margin-bottom:6px; }
  .padrino-role{ font-size:.65rem; letter-spacing:.15em; text-transform:uppercase; color:var(--rosa); display:block; margin-bottom:2px; }

  .gallery{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:24px; }
  .ph{ aspect-ratio:1; background: var(--noche-suave); border:1px solid var(--magenta); display:flex; align-items:center; justify-content:center; font-size:.62rem; color:var(--rosa); letter-spacing:.08em; text-align:center; padding:8px; }

  .mensaje-texto{ font-size:1rem; line-height:1.8; max-width:310px; margin:22px auto 0; color:var(--crema); font-style:italic; opacity:.92; }
  .mensaje-firma{ font-family:'Bodoni Moda', serif; font-style:italic; font-size:1.5rem; color:var(--champagne); margin-top:14px; }

  .rsvp-note{ font-size:.85rem; color:#c9bfae; max-width:280px; margin:14px auto 0; line-height:1.6; }
  .rsvp-input{ display:block; width:100%; max-width:260px; margin:14px auto 0; padding:11px 16px; border-radius:24px; border:1.5px solid currentColor; font-family:inherit; font-size:.88rem; text-align:center; background:rgba(255,255,255,.08); color:inherit; }
  .rsvp-input::placeholder{ color:inherit; opacity:.55; }

  footer{ padding:60px 32px 80px; text-align:center; }
  footer .footer-name{ font-family:'Bodoni Moda', serif; font-style:italic; font-size:2rem; color:var(--champagne); }

  .config-flag{
    position:fixed; bottom:10px; right:10px; background:var(--crema); color:var(--noche);
    font-size:.6rem; padding:4px 8px; border-radius:3px; opacity:.6; font-family:'Manrope',sans-serif; z-index:5;
  }
</style>
</head>
<body>

<div class="wrap">
  <section id="hero" class="fade-up">
    <div class="spotlight-num" id="spotlight-num"></div>
    <div class="eyebrow" id="eyebrow-text"></div>
    <h1 class="quince-name" id="quince-name"></h1>
    <div class="the-date" id="the-date"></div>
    <div class="scroll-hint">Deslizá para ver más ↓</div>
  </section>

  <div class="divider"></div>

  <section id="countdown-section" class="fade-up">
    <h2>Falta poco</h2>
    <div class="countdown">
      <div class="cd-box"><div class="cd-num" id="cd-d">00</div><div class="cd-label">días</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-h">00</div><div class="cd-label">hs</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-m">00</div><div class="cd-label">min</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-s">00</div><div class="cd-label">seg</div></div>
    </div>
  </section>

  <div class="divider"></div>

  <section id="itinerary-section" class="fade-up">
    <h2>La fiesta</h2>
    <div id="itinerary-list" style="margin-top:28px;"></div>
    <div class="venue-name" id="venue-name"></div>
    <div class="venue-addr" id="venue-addr"></div>
    <a class="btn outline" id="maps-btn" href="#" target="_blank" rel="noopener">Cómo llegar</a>
  </section>

  <div class="divider"></div>

  <section id="dresscode-section" class="fade-up">
    <h2>Dress code</h2>
    <div class="dresscode-tag" id="dresscode-text"></div>
  </section>

  <div class="divider"></div>

  <section id="padrinos-section" class="fade-up">
    <h2>Mis padrinos</h2>
    <div class="padrinos" id="padrinos-list"></div>
  </section>

  <div class="divider"></div>

  <section id="gallery-section" class="fade-up">
    <h2>Momentos</h2>
    <div class="gallery" id="gallery-grid"></div>
  </section>

  <div class="divider"></div>

  <section id="mensaje-section" class="fade-up">
    <h2>Mi mensaje</h2>
    <p class="mensaje-texto" id="mensaje-texto"></p>
    <div class="mensaje-firma" id="mensaje-firma"></div>
  </section>

  <div class="divider"></div>

  <section id="rsvp-section" class="fade-up">
    <h2>Confirmá tu asistencia</h2>
    <p class="rsvp-note" id="rsvp-note"></p>
    <input type="text" class="rsvp-input" id="rsvp-nombre" placeholder="Tu nombre" autocomplete="name">
    <a class="btn" id="rsvp-btn" href="#" target="_blank" rel="noopener">Confirmar por WhatsApp</a>
  </section>

  <footer class="fade-up">
    <div class="footer-name" id="footer-name"></div>
    <p style="font-size:.85rem; color:#c9bfae; margin-top:10px;" id="footer-note"></p>
  </footer>
</div>

<div class="config-flag">TEMPLATE · 15-anos-glam v1</div>

<script>
/* ============================================================
   CONFIG — esto es lo único que se edita por cada cliente.
   ============================================================ */
const CONFIG = {
  nombre: "Martina",
  eyebrow: "Mis quince años",
  numero: "15",
  fechaTexto: "22 de Noviembre, 2026",
  fechaCountdown: "2026-11-22T21:00:00",
  itinerario: [
    { hora: "21:00", que: "Recepción de invitados" },
    { hora: "21:30", que: "Entrada y vals" },
    { hora: "22:30", que: "Cena" },
    { hora: "00:00", que: "Fiesta" },
  ],
  lugarNombre: "Salón Imperio",
  lugarDireccion: "Av. Libertador 4820, Buenos Aires",
  mapsUrl: "https://maps.google.com/?q=Salon+Imperio",
  dressCode: "Elegante de fiesta",
  padrinos: [
    { rol: "Madrina", nombre: "Silvina Gómez" },
    { rol: "Padrino", nombre: "Gastón López" },
  ],
  fotos: 4,
  mensaje: "Gracias por acompañarme en cada paso hasta acá. Quiero que esta noche la vivamos todos juntos, con música, baile y mucha alegría.",
  mensajeFirma: "Martina",
  rsvpNota: "Por favor confirmá tu asistencia antes del 1 de Noviembre.",
  whatsappNumero: "5491100000000",
  whatsappMensaje: "¡Hola! Confirmo mi asistencia a los 15 de Martina 💛",
  footerNota: "Gracias por ser parte de esta noche.",
};

// --- Registro de RSVP (Fase 2 del plan comercial: Google Sheet + Apps Script) ---
const RSVP_LOG_URL = ""; // catalogo demo: vacio a proposito hasta Fase 4 (repo de entregas separado) - ver PLAN-COMERCIAL.md
function registrarRSVP(datos){
  if(!RSVP_LOG_URL) return;
  fetch(RSVP_LOG_URL, {
    method: 'POST', mode: 'no-cors',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify(datos)
  }).catch(()=>{});
}

// --- Render ---
document.getElementById('spotlight-num').textContent = CONFIG.numero;
document.getElementById('eyebrow-text').textContent = CONFIG.eyebrow;
document.getElementById('quince-name').textContent = CONFIG.nombre;
document.getElementById('the-date').textContent = CONFIG.fechaTexto;
document.getElementById('footer-name').textContent = CONFIG.nombre;
document.getElementById('footer-note').textContent = CONFIG.footerNota;
document.getElementById('venue-name').textContent = CONFIG.lugarNombre;
document.getElementById('venue-addr').textContent = CONFIG.lugarDireccion;
document.getElementById('maps-btn').href = CONFIG.mapsUrl;
document.getElementById('dresscode-text').textContent = CONFIG.dressCode;
document.getElementById('mensaje-texto').textContent = CONFIG.mensaje;
document.getElementById('mensaje-firma').textContent = CONFIG.mensajeFirma;
document.getElementById('rsvp-note').textContent = CONFIG.rsvpNota;
document.getElementById('rsvp-btn').addEventListener('click', function(e){
  e.preventDefault();
  const nombreInvitado = (document.getElementById('rsvp-nombre').value || '').trim() || 'Un invitado';
  const mensaje = `Soy ${nombreInvitado}. ${CONFIG.whatsappMensaje}`;
  registrarRSVP({ evento: document.title, invitado: nombreInvitado, fechaEvento: CONFIG.fechaTexto || '' });
  window.open(`https://wa.me/${CONFIG.whatsappNumero}?text=${encodeURIComponent(mensaje)}`, '_blank', 'noopener');
});

const itList = document.getElementById('itinerary-list');
CONFIG.itinerario.forEach(item=>{
  const div = document.createElement('div');
  div.className = 'itinerary-item';
  div.innerHTML = `<div class="itinerary-time">${item.hora}</div><div class="itinerary-what">${item.que}</div>`;
  itList.appendChild(div);
});

const padrinosList = document.getElementById('padrinos-list');
CONFIG.padrinos.forEach(p=>{
  const div = document.createElement('div');
  div.className = 'padrino-item';
  div.innerHTML = `<span class="padrino-role">${p.rol}</span>${p.nombre}`;
  padrinosList.appendChild(div);
});

const gallery = document.getElementById('gallery-grid');
for(let i=0;i<CONFIG.fotos;i++){
  const ph = document.createElement('div');
  ph.className = 'ph';
  ph.textContent = 'Foto ' + (i+1);
  gallery.appendChild(ph);
}

// --- Countdown ---
function tick(){
  const target = new Date(CONFIG.fechaCountdown);
  const now = new Date();
  let diff = Math.max(0, target - now);
  document.getElementById('cd-d').textContent = String(Math.floor(diff/(1000*60*60*24))).padStart(2,'0');
  document.getElementById('cd-h').textContent = String(Math.floor((diff/(1000*60*60))%24)).padStart(2,'0');
  document.getElementById('cd-m').textContent = String(Math.floor((diff/(1000*60))%60)).padStart(2,'0');
  document.getElementById('cd-s').textContent = String(Math.floor((diff/1000)%60)).padStart(2,'0');
}
tick(); setInterval(tick, 1000);

// --- Fade up on scroll ---
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
}, {threshold:0.25});
document.querySelectorAll('.fade-up').forEach(el=>observer.observe(el));
</script>
</body>
</html>
